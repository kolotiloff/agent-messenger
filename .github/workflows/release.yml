name: Release preview

# Builds, signs and publishes one preview from main: the signed Mac app, the
# Windows and Linux programs (not code-signed; D-045, D-047) and their signed
# update archives for the window's own update (D-048). Runs only when
# started by hand. The signing key comes from the SPARKLE_ED_PRIVATE_KEY
# secret, lives in a 0600 temp file during signing, and is removed afterwards.
# Every signature is checked against the app's public key before upload.

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Preview version, for example 1.0.0-preview.103"
        required: true
      notes:
        description: "Release notes shown in the app (plain text)"
        required: true

      resume_revision:
        description: "Existing signed draft only: exact 40-character source SHA. Leave empty to build."
        required: false
        type: string
      retire_legacy_manifests:
        description: "Archive blocking 0.98/0.99 update manifests after checking their signed replacement"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-mac-preview
  cancel-in-progress: false

jobs:
  others:
    name: Windows and Linux programs
    if: inputs.resume_revision == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are built from main only." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Validate version
        run: |
          python3 scripts/release_version.py "$VERSION"
      - name: Checks (no real models)
        run: bash scripts/check.sh
      - name: Build programs and update archives
        run: bash scripts/package-others.sh "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/others" "$RUNNER_TEMP/others-updates"
      - name: Smoke test the Linux build
        run: |
          "$RUNNER_TEMP/others/AgentMessenger-Linux-x64" version | grep -F "\"version\":\"$VERSION\""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: others-${{ github.sha }}
          path: ${{ runner.temp }}/others/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: others-updates-${{ github.sha }}
          path: ${{ runner.temp }}/others-updates/*
          if-no-files-found: error
          retention-days: 3

  mac-checks:
    name: Mac checks
    if: inputs.resume_revision == ''
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are built from main only." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Checks (no real models)
        run: bash scripts/check.sh

  release:
    name: Build, sign and publish
    # The Mac checks run next to the Windows and Linux job instead of after
    # it; publishing still waits for both.
    needs: [others, mac-checks]
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are built from main only." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Validate version and tag
        run: |
          python3 scripts/release_version.py "$VERSION"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2; exit 1
          fi
          [[ -n "$NOTES" && ${#NOTES} -le 4000 ]] || { echo "Notes are required (at most 4000 characters)" >&2; exit 1; }
      - name: Build the app
        run: |
          SPARKLE_DIR="$RUNNER_TEMP/sparkle" bash scripts/build-mac-app.sh "$RUNNER_TEMP/app" "$VERSION" "$GITHUB_SHA"
          python3 scripts/check-desktop.py "$RUNNER_TEMP/app/Agent Messenger.app/Contents/Resources/messenger"
      - name: Sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || { echo "Secret SPARKLE_ED_PRIVATE_KEY is not set" >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/sparkle-key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          python3 scripts/publish-local-update.py "$RUNNER_TEMP/app" \
            --sparkle "$RUNNER_TEMP/sparkle" --notes "$RUNNER_TEMP/notes.txt" \
            --key-file "$key" --directory "$RUNNER_TEMP/channel"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: others-${{ github.sha }}
          path: ${{ runner.temp }}/others
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: others-updates-${{ github.sha }}
          path: ${{ runner.temp }}/others-updates
      - name: Sign the Windows and Linux updates
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/sparkle-key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          python3 scripts/sign-other-updates.py "$RUNNER_TEMP/others-updates" --version "$VERSION" --revision "$GITHUB_SHA" \
            --notes "$RUNNER_TEMP/notes.txt" --sign "$RUNNER_TEMP/sparkle/bin/sign_update --ed-key-file $key -p" \
            --public-key "$(cat desktop/macos/update-public-key.txt)" --out "$RUNNER_TEMP/others-signed"
      - name: Publish (draft first, then public)
        run: |
          mac=("$RUNNER_TEMP"/app/release-assets/*)
          [[ ${#mac[@]} == 3 ]] || { echo "Expected exactly 3 Mac release assets" >&2; exit 1; }
          # The signed app zip is named by its checksum for the in-app updater.
          # A copy under a fixed name is what the download button links to (D-047).
          app=("$RUNNER_TEMP"/app/release-assets/*.zip)
          [[ ${#app[@]} == 1 ]] || { echo "Expected exactly one Mac app zip" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/download"
          cp "${app[0]}" "$RUNNER_TEMP/download/AgentMessenger-Mac.zip"
          cmp "${app[0]}" "$RUNNER_TEMP/download/AgentMessenger-Mac.zip"
          others=("$RUNNER_TEMP"/others/*)
          [[ ${#others[@]} == 5 ]] || { echo "Expected exactly 5 Windows and Linux release assets" >&2; exit 1; }
          (cd "$RUNNER_TEMP/others" && shasum -a 256 -c AgentMessenger-Windows-Linux-SHA256.txt)
          updates=("$RUNNER_TEMP"/others-signed/*)
          [[ ${#updates[@]} == 12 ]] || { echo "Expected exactly 12 signed Windows and Linux update assets" >&2; exit 1; }
          sh -n scripts/install-server.sh
          # The VPS installer (T-036) downloads the Linux program of the same
          # release and checks it against the checksum file above.
          assets=("${mac[@]}" "$RUNNER_TEMP/download/AgentMessenger-Mac.zip" "${others[@]}" "${updates[@]}" scripts/install-server.sh)
          # Keep existing installer URLs and add the public Kotel download names.
          for file in "$RUNNER_TEMP/download/AgentMessenger-Mac.zip" "${others[@]}"; do
            name=${file##*/}
            alias="$RUNNER_TEMP/download/Kotel-${name#AgentMessenger-}"
            if [[ "$name" == *SHA256.txt ]]; then
              sed 's/AgentMessenger-/Kotel-/g' "$file" > "$alias"
            else
              cp "$file" "$alias"
            fi
            assets+=("$alias")
          done
          (cd "$RUNNER_TEMP/download" && shasum -a 256 -c Kotel-Windows-Linux-SHA256.txt)
          # The page gets the notes and the download links; the app shows only
          # the notes (they are signed into the update above).
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            cat "$RUNNER_TEMP/notes.txt"
            printf '\n### Скачать\n\n'
            printf -- '- **Mac** (Apple Silicon): [Kotel-Mac.zip](%s/Kotel-Mac.zip)\n' "$base"
            printf -- '- **Windows**: [Kotel-Windows-x64.exe](%s/Kotel-Windows-x64.exe) · ARM: [Kotel-Windows-ARM64.exe](%s/Kotel-Windows-ARM64.exe)\n' "$base" "$base"
            printf -- '- **Linux**: [Kotel-Linux-x64](%s/Kotel-Linux-x64) · ARM: [Kotel-Linux-ARM64](%s/Kotel-Linux-ARM64)\n' "$base" "$base"
            printf -- '- **Сервер на Linux (VPS)**, одной командой от root: `curl -fsSL https://github.com/%s/releases/latest/download/install-server.sh | sh`\n' "$GITHUB_REPOSITORY"
            printf '\nКак запустить: https://github.com/%s/blob/main/docs/DOWNLOAD.md\n' "$GITHUB_REPOSITORY"
          } > "$RUNNER_TEMP/page.md"
          # The title shows the short version (0.58); the tag keeps the full
          # one, which installed programs check (owner, 2026-11-09).
          # Not a pre-release, so /releases/latest/download/<name> always
          # points to this build. The in-app updater reads every release.
          gh release create "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --draft --latest \
            --target "$GITHUB_SHA" --title "Kotel $(python3 scripts/release_version.py "$VERSION")" --notes-file "$RUNNER_TEMP/page.md"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-key"

  signed-install:
    name: Signed update / ${{ matrix.target }}
    needs: release
    # Resume only a signed draft from main. Never sign a second build of the same version.
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.release.result == 'success' || (inputs.resume_revision != '' && needs.release.result == 'skipped'))
    permissions:
      contents: write # read unpublished release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: darwin-arm64}
          - {runner: windows-2025, target: windows-amd64}
          - {runner: windows-11-arm, target: windows-arm64}
          - {runner: ubuntu-24.04, target: linux-amd64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Exercise the previous release and the signed draft on this platform
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BRIDGE_TARGET: ${{ matrix.target }}
          CANDIDATE_REVISION: ${{ inputs.resume_revision || github.sha }}
        run: |
          python3 scripts/release_version.py "$VERSION"
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CANDIDATE_REVISION" "$GITHUB_SHA"
          draft_revision=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')
          [[ "$draft_revision" == "$CANDIDATE_REVISION" ]]
          export PREVIOUS_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          python3 scripts/check-signed-install.py

  channel:
    name: Publish the verified draft and check the public channel
    needs: signed-install
    if: always() && !cancelled() && needs.signed-install.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      RETIRE_LEGACY: ${{ inputs.retire_legacy_manifests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Publish the same signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
      - name: Verify the public channel on all five targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$RETIRE_LEGACY" == "true" ]]; then flags+=(--retire-legacy-manifests); fi
          python3 scripts/check-release-channel.py "$VERSION" "${flags[@]}"
