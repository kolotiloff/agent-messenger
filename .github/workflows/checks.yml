name: Client checks (no real models)

"on":
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  window-controls:
    name: Window controls (fictional data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/window-tests" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/window-tests/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Check settings and first-run setup with real input
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/window-tests/node_modules/playwright"
          for engine in chromium webkit; do
            BROWSER_ENGINE="$engine" node scripts/check-window-controls.cjs
          done

  native:
    name: Tests / ${{ matrix.runner }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            go: '1.22.2'
            cross: true
          - runner: macos-15
            go: '1.22.2'
          - runner: macos-15
            go: stable
            package: true
          - runner: ubuntu-24.04
            go: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Format, module integrity, vet and native race tests
        run: bash scripts/check.sh
      - name: Compile targets and test binaries (not runtime acceptance)
        if: matrix.cross == true
        run: bash scripts/check-builds.sh
      - name: Build two Mac preview versions
        if: matrix.package == true
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          for version in 0.0.0-preview.ci1 0.0.0-preview.ci2; do
            go run -ldflags=-linkmode=external ./cmd/package-preview \
              --version "$version" --revision "$SOURCE_REVISION" \
              --external-linker --out "$RUNNER_TEMP/mac-preview"
          done
      - name: Verify archive, clean install and update without losing queue
        if: matrix.package == true
        run: python3 scripts/check-package.py "$RUNNER_TEMP/mac-preview" 0.0.0-preview.ci1 0.0.0-preview.ci2
      - name: Build native Mac app and check client lifecycle (no GUI acceptance)
        if: matrix.package == true
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          bash scripts/build-mac-app.sh "$RUNNER_TEMP/mac-desktop" 0.0.0-preview.appci "$SOURCE_REVISION"
          python3 scripts/check-desktop.py "$RUNNER_TEMP/mac-desktop/Agent Messenger.app/Contents/Resources/messenger"
      - name: Save tested Mac preview archives (not a release)
        if: matrix.package == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mac-preview/*
            ${{ runner.temp }}/mac-desktop/Agent-Messenger-mac.zip*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Tests / windows-2025 / Go stable
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Windows runtime checks (lock, job objects, background client, task runs)
        run: bash scripts/check-windows.sh
      - name: Windows setup and LAN discovery regressions (no real agents)
        run: |
          go test -count=1 -timeout=3m ./internal/localui -run '^(TestWindowsSetupFind|TestWindowsTerminalCreatesInteractiveChild|TestAgentSetupReceiptAndRegistration|TestAgentSetupUnknownIsNotRetried|TestSetupFindRecoversMissingInstallReceipt|TestTrustUsesRegisteredCLIAndExactFolder|TestAgentLoginAndInstallRoutes)$'
          go test -count=1 -timeout=3m ./internal/broker -run '^(TestDiscoverySurvivesLostFirstDatagram|TestDiscoveryCancellation|TestUnavailableDiscoveryDoesNotOfferShortCode)$'
      - name: Whole suite on Windows (information only; many tests use POSIX shell fake CLIs)
        continue-on-error: true
        run: go test -count=1 -timeout=15m ./... 2>&1 | tail -n 200


  packages:
    name: Windows and Linux downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build the downloads (the release builds them the same way)
        run: bash scripts/package-others.sh 0.0.0-preview.ci "$GITHUB_SHA" "$RUNNER_TEMP/others" "$RUNNER_TEMP/updates"
      - name: The update archives are signed and checked (throwaway key)
        run: |
          # The release signs with the real key on the macOS job; here a
          # throwaway key checks the script and the archives it accepts.
          mkdir -p "$RUNNER_TEMP/signer"
          cat > "$RUNNER_TEMP/signer/main.go" <<'GO'
          package main

          import (
          	"crypto/ed25519"
          	"encoding/base64"
          	"fmt"
          	"os"
          )

          var key = ed25519.NewKeyFromSeed(make([]byte, 32))

          func main() {
          	if os.Args[1] == "public" {
          		fmt.Println(base64.StdEncoding.EncodeToString(key.Public().(ed25519.PublicKey)))
          		return
          	}
          	data, err := os.ReadFile(os.Args[len(os.Args)-1])
          	if err != nil {
          		os.Exit(1)
          	}
          	fmt.Println(base64.StdEncoding.EncodeToString(ed25519.Sign(key, data)))
          }
          GO
          go build -o "$RUNNER_TEMP/test-signer" "$RUNNER_TEMP/signer/main.go"
          echo "test notes" > "$RUNNER_TEMP/notes.txt"
          python3 scripts/sign-other-updates.py "$RUNNER_TEMP/updates" --version 0.0.0-preview.1 --revision "$GITHUB_SHA" \
            --notes "$RUNNER_TEMP/notes.txt" --sign "$RUNNER_TEMP/test-signer -p" \
            --public-key "$("$RUNNER_TEMP/test-signer" public)" --out "$RUNNER_TEMP/signed"
          ls "$RUNNER_TEMP/signed"
          [[ $(ls "$RUNNER_TEMP/signed" | wc -l) == 12 ]]
      - name: The Linux download installs and starts the client
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          # A browser download loses the executable bit; the guide says chmod +x.
          install -m 0644 "$RUNNER_TEMP/others/AgentMessenger-Linux-x64" "$dir/AgentMessenger-Linux-x64"
          chmod +x "$dir/AgentMessenger-Linux-x64"
          export HOME="$RUNNER_TEMP/home"
          exe="$dir/AgentMessenger-Linux-x64"
          "$exe" install --prefix "$HOME/.local"
          "$HOME/.local/bin/messenger" version
          "$HOME/.local/bin/messenger" --root "$HOME/data" start --allow-tasks
          "$HOME/.local/bin/messenger" --root "$HOME/data" status
          "$HOME/.local/bin/messenger" --root "$HOME/data" shutdown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: others-ci-${{ github.sha }}
          path: ${{ runner.temp }}/others/*
          if-no-files-found: error
          retention-days: 3

  windows-package:
    name: Windows download on Windows
    needs: packages
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: others-ci-${{ github.sha }}
          path: ${{ runner.temp }}/others
      - name: Run the client from the downloaded program
        run: |
          cd "$RUNNER_TEMP/others"
          sha256sum -c AgentMessenger-Windows-Linux-SHA256.txt
          exe="$PWD/AgentMessenger-Windows-x64.exe"
          export LOCALAPPDATA="$RUNNER_TEMP/local"
          "$exe" version
          "$exe" --root "$RUNNER_TEMP/data" start --allow-tasks
          "$exe" --root "$RUNNER_TEMP/data" status
          "$exe" --root "$RUNNER_TEMP/data" shutdown
      - name: Install for the user and remove, keeping the data (T-053)
        run: |
          export MSYS_NO_PATHCONV=1
          cd "$RUNNER_TEMP/others"
          exe="$PWD/AgentMessenger-Windows-x64.exe"
          export LOCALAPPDATA="$RUNNER_TEMP/install-local" APPDATA="$RUNNER_TEMP/install-roaming"
          key='HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\AgentMessenger'
          "$exe" install
          installed="$LOCALAPPDATA/Programs/Agent Messenger/AgentMessenger.exe"
          shortcut="$APPDATA/Microsoft/Windows/Start Menu/Programs/Agent Messenger.lnk"
          test -f "$installed"
          "$installed" version
          reg query "$key" /v UninstallString
          reg query "$key" /v DisplayVersion
          test -f "$shortcut"
          mkdir -p "$LOCALAPPDATA/AgentMessenger"
          echo keep > "$LOCALAPPDATA/AgentMessenger/keep.txt"
          "$installed" uninstall < /dev/null
          if reg query "$key" >/dev/null 2>&1; then echo "entry left in Apps"; exit 1; fi
          test ! -e "$shortcut"
          for i in $(seq 1 30); do [ -e "$LOCALAPPDATA/Programs/Agent Messenger" ] || break; sleep 1; done
          test ! -e "$LOCALAPPDATA/Programs/Agent Messenger"
          test -f "$LOCALAPPDATA/AgentMessenger/keep.txt"
